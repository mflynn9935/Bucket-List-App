<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5eee7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Bucket List</title>
<style>
:root{
  --bg:#f7f2ec; --card:#fffdf9; --ink:#302b27; --muted:#7d746d;
  --accent:#986b4a; --line:#e5dbd1; --done:#58765c; --danger:#a44f4f;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding-bottom:94px;
}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(247,242,236,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:18px 14px 12px;
}
.head,.wrap{max-width:820px;margin:auto}
.title{font-size:29px;font-weight:850}
.subtitle{font-size:13px;color:var(--muted);margin-top:2px}
.wrap{padding:14px}

.status-tabs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px
}
.tab{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:16px;padding:12px 6px;font-weight:800
}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.tab .count{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px}

.filter-title{
  font-size:12px;font-weight:800;color:var(--muted);
  letter-spacing:.04em;margin:3px 0 8px
}
.filter-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px
}
.filter{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:16px;padding:11px;text-align:left;font-weight:750
}
.filter small{
  display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px
}
.filter.active{background:var(--ink);border-color:var(--ink);color:white}
.filter.active small{color:#ddd5ce}

.summary{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:13px;margin-bottom:12px
}
.summary-row{
  display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:7px
}
.track{height:9px;background:#e9dfd6;border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--done);width:0}

.search{margin-bottom:12px}
input,select,textarea,button{font:inherit}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:14px;
  background:white;color:var(--ink);padding:11px
}
button{
  border:0;border-radius:14px;padding:11px 13px;
  background:var(--accent);color:white;font-weight:750
}
button.secondary{background:#e9dfd6;color:var(--ink)}
button.danger{background:var(--danger)}

.list{display:grid;gap:10px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:14px
}
.top{display:flex;gap:11px;align-items:flex-start}
.emoji{font-size:32px;width:40px;text-align:center}
.main{flex:1;min-width:0}
.name{font-size:18px;font-weight:850}
.goal{font-size:13px;color:var(--muted);margin-top:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:#eee4da;padding:5px 8px;border-radius:999px}
.badge{
  font-size:11px;padding:6px 8px;border-radius:999px;
  background:#eee4da;white-space:nowrap
}
.badge.booked{background:#e5e3f2;color:#484569}
.badge.done{background:#dce8dd;color:#36533a}
.meta{font-size:13px;color:var(--muted);margin-top:8px}
.memory{font-size:14px;margin-top:9px}
.open{width:100%;margin-top:11px}
.empty{
  background:var(--card);border:1px dashed var(--line);border-radius:18px;
  padding:28px 16px;text-align:center;color:var(--muted)
}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}

footer{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:rgba(255,253,249,.97);border-top:1px solid var(--line);
  padding:9px 13px calc(9px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr auto auto;gap:8px
}

dialog{
  width:min(94vw,700px);max-height:90vh;overflow:auto;
  border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink)
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.modal{padding:18px}
.modal-head{display:flex;align-items:center;gap:10px}
.modal-head h2{margin:0;flex:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.check{
  display:flex;align-items:center;gap:7px;background:#f1e9e1;
  padding:9px;border-radius:12px;font-size:13px;color:var(--ink)
}
.check input{width:auto}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px}
.actions{display:flex;gap:8px;margin-top:15px}
.actions button{flex:1}
.note{font-size:11px;color:var(--muted);margin-top:6px}

@media(min-width:650px){
  .filter-grid{grid-template-columns:repeat(4,1fr)}
  .list{grid-template-columns:1fr 1fr}
  .checks{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="head">
    <div class="title">Bucket List</div>
    <div class="subtitle">Dream it. Book it. Do it. Keep the memory.</div>
  </div>
</header>

<div class="wrap">

  <div class="status-tabs">
    <button class="tab active" data-status="dream">💭 Dreaming<span id="dreamCount" class="count"></span></button>
    <button class="tab" data-status="booked">📅 Booked<span id="bookedCount" class="count"></span></button>
    <button class="tab" data-status="done">❤️ Complete<span id="doneCount" class="count"></span></button>
  </div>

  <div class="filter-title">FILTER</div>
  <div id="filters" class="filter-grid"></div>

  <div class="summary">
    <div class="summary-row">
      <span>Overall progress</span>
      <span id="progressText">0 complete</span>
    </div>
    <div class="track"><div id="progressBar" class="fill"></div></div>
  </div>

  <div class="search">
    <input id="search" placeholder="Search your bucket list…">
  </div>

  <div id="list" class="list"></div>
</div>

<footer>
  <button id="add">＋ Add</button>
  <button id="importBtn" class="secondary">Import</button>
  <button id="backupBtn" class="secondary">Backup</button>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
</footer>

<dialog id="editor">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Bucket item</h2>
      <button id="close" class="secondary">Close</button>
    </div>

    <input id="editId" type="hidden">

    <div class="row">
      <div>
        <label>Emoji</label>
        <input id="emoji" maxlength="6" placeholder="✨">
      </div>
      <div>
        <label>Status</label>
        <select id="status">
          <option value="dream">💭 Dreaming</option>
          <option value="booked">📅 Booked</option>
          <option value="done">❤️ Complete</option>
        </select>
      </div>
    </div>

    <label>What do you want to do?</label>
    <input id="name" placeholder="Feed a giraffe">

    <label>What would make it count?</label>
    <input id="goal" placeholder="Hand-feed and interact with one">

    <label>Filters <span class="note">(choose as many as fit)</span></label>
    <div id="filterChecks" class="checks"></div>

    <div class="row">
      <div>
        <label>Booked date</label>
        <input id="bookedDate" type="date">
      </div>
      <div>
        <label>Completed date</label>
        <input id="completedDate" type="date">
      </div>
    </div>

    <label>Where</label>
    <input id="place" placeholder="Place, city, restaurant, zoo…">

    <label>Link</label>
    <input id="link" type="url" placeholder="https://…">

    <label>Who with</label>
    <input id="withWho" placeholder="Solo, friend, family…">

    <label>Rating</label>
    <select id="rating">
      <option value="">Not rated</option>
      <option value="5">★★★★★</option>
      <option value="4">★★★★</option>
      <option value="3">★★★</option>
      <option value="2">★★</option>
      <option value="1">★</option>
    </select>

    <label>Memory / notes</label>
    <textarea id="memory" rows="4" placeholder="What happened? What was the best part?"></textarea>

    <label>Photos</label>
    <input id="photoInput" type="file" accept="image/*" multiple>
    <div id="photos" class="photos"></div>

    <div class="note">Your list and photos stay on this device. Use Backup before changing phones or clearing browser data.</div>

    <div class="actions">
      <button id="save">Save</button>
      <button id="delete" class="danger">Delete</button>
    </div>
  </div>
</dialog>

<script>
const STORAGE_KEY = 'bucket_list_clean_final_1';

const FILTERS = [
  ['all','✨ All'],
  ['animals','🐾 Animal Encounters'],
  ['travel','🌎 Travel & Experiences'],
  ['food','🍴 Food'],
  ['education','📚 Education & DIY'],
  ['garden','🌱 Gardening & Plants'],
  ['rocks','🪨 Rockhounding']
];

const STARTER_ANIMALS = [
 ['🦒','Giraffe','Hand-feed + touch'],
 ['🐘','Elephant','Feed + touch + husbandry/bathing'],
 ['🐺','Wolves','Touch + close interaction'],
 ['🦁','Big cats','Lions, tigers, leopards and other big cats'],
 ['🐈','Small wild cats','Serval, caracal, lynx, bobcat and more'],
 ['🦦','Otters','Loose interaction; lap contact is the dream'],
 ['🦭','Sea lions / seals','Feed + training + touch'],
 ['🐧','Penguins','Feed + direct interaction'],
 ['🦈','Sharks','Touch or personally feed'],
 ['🐋','Whales','Beluga or whale direct interaction'],
 ['🦓','Zebras','Feed at close range'],
 ['🐙','Octopus','Direct interaction or feeding'],
 ['🦏','Rhinos','Touch + feed'],
 ['🦛','Hippos','Feed; pygmy and common hippo goals'],
 ['🐫','Camels','Feed + pet'],
 ['🦌','Elk','Feed + touch'],
 ['🫎','Moose','Feed + close interaction'],
 ['🦌','Reindeer','Feed + pet'],
 ['🦘','Kangaroos','Walk-through + feed/pet'],
 ['🦊','Foxes','Pet + feed + direct interaction']
];

let activeStatus = 'dream';
let activeFilter = 'all';
let items = loadItems();

const $ = id => document.getElementById(id);

function uid(){
  return (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
}

function starterItems(){
  return STARTER_ANIMALS.map(a => ({
    id: uid(),
    emoji: a[0],
    name: a[1],
    goal: a[2],
    status: 'dream',
    filters: ['animals'],
    bookedDate: '',
    completedDate: '',
    place: '',
    link: '',
    withWho: '',
    rating: '',
    memory: '',
    photos: []
  }));
}

function loadItems(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(Array.isArray(saved)) return saved;
  }catch(e){}
  const seeded = starterItems();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
  return seeded;
}

function saveItems(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function esc(s=''){
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function filterLabel(key){
  const found = FILTERS.find(f => f[0] === key);
  return found ? found[1] : key;
}

function filterCount(key){
  if(key === 'all') return items.length;
  return items.filter(x => (x.filters || []).includes(key)).length;
}

function renderFilters(){
  $('filters').innerHTML = '';
  FILTERS.forEach(([key,label]) => {
    const b = document.createElement('button');
    b.className = 'filter' + (activeFilter === key ? ' active' : '');
    const count = filterCount(key);
    b.innerHTML = `${label}<small>${count} item${count===1?'':'s'}</small>`;
    b.onclick = () => {
      activeFilter = key;
      render();
    };
    $('filters').appendChild(b);
  });
}

function render(){
  renderFilters();

  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.status === activeStatus);
  });

  const q = $('search').value.toLowerCase().trim();

  const visible = items.filter(x => {
    const statusOkay = x.status === activeStatus;
    const filterOkay = activeFilter === 'all' || (x.filters || []).includes(activeFilter);
    const haystack = `${x.name} ${x.goal} ${x.place} ${x.memory}`.toLowerCase();
    const searchOkay = !q || haystack.includes(q);
    return statusOkay && filterOkay && searchOkay;
  });

  $('list').innerHTML = '';

  if(!visible.length){
    $('list').innerHTML = `
      <div class="empty">
        <b>Nothing here yet.</b>
        Tap “Add” whenever you find something worth doing.
      </div>`;
  }

  visible.forEach(x => {
    const card = document.createElement('div');
    card.className = 'card';

    const badge =
      x.status === 'done' ? 'Complete' :
      x.status === 'booked' ? 'Booked' : 'Dreaming';

    card.innerHTML = `
      <div class="top">
        <div class="emoji">${x.emoji || '✨'}</div>
        <div class="main">
          <div class="name">${esc(x.name)}</div>
          ${x.goal ? `<div class="goal">${esc(x.goal)}</div>` : ''}
          <div class="tags">
            ${(x.filters || []).map(f => `<span class="tag">${esc(filterLabel(f))}</span>`).join('')}
          </div>
        </div>
        <span class="badge ${x.status}">${badge}</span>
      </div>

      ${x.place ? `<div class="meta">📍 ${esc(x.place)}</div>` : ''}
      ${x.status === 'booked' && x.bookedDate ? `<div class="meta">📅 ${esc(x.bookedDate)}</div>` : ''}
      ${x.status === 'done' && x.completedDate ? `<div class="meta">❤️ ${esc(x.completedDate)}</div>` : ''}
      ${x.rating ? `<div class="meta">${'★'.repeat(Number(x.rating))}</div>` : ''}
      ${x.memory ? `<div class="memory">${esc(x.memory).slice(0,160)}${x.memory.length > 160 ? '…' : ''}</div>` : ''}

      <button class="open">Open</button>
    `;

    card.querySelector('.open').onclick = () => openEditor(x.id);
    $('list').appendChild(card);
  });

  const dreams = items.filter(x => x.status === 'dream').length;
  const booked = items.filter(x => x.status === 'booked').length;
  const done = items.filter(x => x.status === 'done').length;

  $('dreamCount').textContent = `${dreams} items`;
  $('bookedCount').textContent = `${booked} items`;
  $('doneCount').textContent = `${done} items`;

  $('progressText').textContent = `${done} of ${items.length} complete`;
  $('progressBar').style.width = (items.length ? Math.round(done/items.length*100) : 0) + '%';
}

function buildFilterChecks(selected=[]){
  $('filterChecks').innerHTML = '';
  FILTERS.filter(f => f[0] !== 'all').forEach(([key,label]) => {
    const lab = document.createElement('label');
    lab.className = 'check';
    lab.innerHTML = `
      <input type="checkbox" value="${key}" ${selected.includes(key) ? 'checked' : ''}>
      <span>${label}</span>
    `;
    $('filterChecks').appendChild(lab);
  });
}

function showPhotos(arr=[]){
  $('photos').innerHTML = '';
  $('photos').dataset.current = JSON.stringify(arr);
  arr.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    $('photos').appendChild(img);
  });
}

function openEditor(id){
  const x = items.find(i => i.id === id);
  if(!x) return;

  $('editId').value = x.id;
  $('emoji').value = x.emoji || '';
  $('name').value = x.name || '';
  $('goal').value = x.goal || '';
  $('status').value = x.status || 'dream';
  $('bookedDate').value = x.bookedDate || '';
  $('completedDate').value = x.completedDate || '';
  $('place').value = x.place || '';
  $('link').value = x.link || '';
  $('withWho').value = x.withWho || '';
  $('rating').value = x.rating || '';
  $('memory').value = x.memory || '';

  $('modalTitle').textContent = x.name || 'Bucket item';
  buildFilterChecks(x.filters || []);
  showPhotos(x.photos || []);
  $('delete').style.display = 'block';
  $('editor').showModal();
}

function newItem(){
  $('editId').value = '';
  ['emoji','name','goal','bookedDate','completedDate','place','link','withWho','memory'].forEach(id => $(id).value = '');
  $('status').value = activeStatus;
  $('rating').value = '';
  buildFilterChecks(activeFilter === 'all' ? [] : [activeFilter]);
  showPhotos([]);
  $('modalTitle').textContent = 'Add to bucket list';
  $('delete').style.display = 'none';
  $('editor').showModal();
}

$('photoInput').onchange = async e => {
  const files = [...e.target.files].slice(0,8);
  const data = await Promise.all(files.map(file => new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(file);
  })));
  showPhotos(data);
};

$('save').onclick = () => {
  const id = $('editId').value;
  const existing = items.find(x => x.id === id);
  const filters = [...$('filterChecks').querySelectorAll('input:checked')].map(x => x.value);

  const obj = {
    id: id || uid(),
    emoji: $('emoji').value || '✨',
    name: $('name').value || 'Untitled',
    goal: $('goal').value,
    status: $('status').value,
    filters,
    bookedDate: $('bookedDate').value,
    completedDate: $('completedDate').value,
    place: $('place').value,
    link: $('link').value,
    withWho: $('withWho').value,
    rating: $('rating').value,
    memory: $('memory').value,
    photos: JSON.parse($('photos').dataset.current || '[]')
  };

  if(existing) Object.assign(existing,obj);
  else items.push(obj);

  saveItems();
  $('editor').close();
  render();
};

$('delete').onclick = () => {
  const id = $('editId').value;
  if(confirm('Delete this bucket list item?')){
    items = items.filter(x => x.id !== id);
    saveItems();
    $('editor').close();
    render();
  }
};

$('close').onclick = () => $('editor').close();
$('add').onclick = newItem;
$('search').oninput = render;

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    activeStatus = b.dataset.status;
    render();
  };
});

$('backupBtn').onclick = () => {
  const payload = {version:1,items};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bucket-list-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

$('importBtn').onclick = () => $('importFile').click();

$('importFile').onchange = async e => {
  try{
    const text = await e.target.files[0].text();
    const parsed = JSON.parse(text);
    const incoming = Array.isArray(parsed) ? parsed : parsed.items;
    if(!Array.isArray(incoming)) throw new Error('Invalid backup');

    if(confirm('Replace this device’s bucket list with this backup?')){
      items = incoming;
      saveItems();
      render();
      alert('Backup restored.');
    }
  }catch(err){
    alert('That backup file could not be read.');
  }
};

render();
</script>
</body>
</html>
